version: 3
automerge: false
parallel_plan: true
parallel_apply: false

projects:
  - name: dev-team-a-b-bucket-test
    dir: environments/dev/team-a/bucket/bucket-test
    workspace: default
    workflow: default
    autoplan:
      when_modified: ["*.tf", "*.tfvars", "*.yaml", "*.yml"]
      enabled: true
    apply_requirements: [approved, mergeable]

  - name: dev-team-a-b-bucket-test2
    dir: environments/dev/team-a/bucket/bucket-test2
    workspace: default
    workflow: default
    autoplan:
      when_modified: ["*.tf", "*.tfvars", "*.yaml", "*.yml"]
      enabled: true
    apply_requirements: [approved, mergeable]

  - name: homolog-team-b-b-bucket-a
    dir: environments/homolog/team-b/bucket/bucket-a
    workspace: default
    workflow: default
    autoplan:
      when_modified: ["*.tf", "*.tfvars", "*.yaml", "*.yml"]
      enabled: true
    apply_requirements: [approved, mergeable]

  - name: homolog-team-b-b-bucket-b
    dir: environments/homolog/team-b/bucket/bucket-b
    workspace: default
    workflow: default
    autoplan:
      when_modified: ["*.tf", "*.tfvars", "*.yaml", "*.yml"]
      enabled: true
    apply_requirements: [approved, mergeable]

  - name: prod-team-b-b-bucket-a
    dir: environments/prod/team-b/bucket/bucket-a
    workspace: default
    workflow: default
    autoplan:
      when_modified: ["*.tf", "*.tfvars", "*.yaml", "*.yml"]
      enabled: true
    apply_requirements: [approved, mergeable]

  - name: prod-team-b-b-bucket-b
    dir: environments/prod/team-b/bucket/bucket-b
    workspace: default
    workflow: default
    autoplan:
      when_modified: ["*.tf", "*.tfvars", "*.yaml", "*.yml"]
      enabled: true
    apply_requirements: [approved, mergeable]

workflows:
  default:
    plan:
      steps:
        - init
        - plan
    apply:
      steps:
        - apply
