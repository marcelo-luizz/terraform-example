version: 3
automerge: false
parallel_plan: true
parallel_apply: false

projects:
  - name: dev
    dir: environments/dev/**/*
    workspace: default
    workflow: default
    autoplan:
      when_modified: ["*.tf", "*.tfvars", "*.yaml", "*.yml"]
      enabled: true
    apply_requirements: [approved, mergeable]

  - name: homolog
    dir: environments/homolog/**/*
    workspace: default
    workflow: default
    autoplan:
      when_modified: ["*.tf", "*.tfvars", "*.yaml", "*.yml"]
      enabled: true
    apply_requirements: [approved, mergeable]

  - name: prod
    dir: environments/prod/**/*
    workspace: default
    workflow: default
    autoplan:
      when_modified: ["*.tf", "*.tfvars", "*.yaml", "*.yml"]
      enabled: true
    apply_requirements: [approved, mergeable]

workflows:
  default:
    plan:
      steps:
        - init
        - plan
    apply:
      steps:
        - apply
