version: 3
automerge: false
parallel_plan: true
parallel_apply: false

# Configuração para descoberta automática de novos buckets
autodiscovery:
  # Isso diz ao Atlantis: "Toda pasta nova que você achar, use o workflow 'dev'"
  mappings:
    - dir_group: environments/dev/team-a/bucket
      workflow: dev

workflows:
  dev:
    plan:
      steps:
        - env:
            name: GOOGLE_IMPERSONATE_SERVICE_ACCOUNT
            value: atlantis-sa@jeitto-dev.iam.gserviceaccount.com
        - init
        - plan
    apply:
      steps:
        - env:
            name: GOOGLE_IMPERSONATE_SERVICE_ACCOUNT
            value: atlantis-sa@jeitto-dev.iam.gserviceaccount.com
        - apply
