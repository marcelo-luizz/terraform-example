repos:
  - id: github.com/marcelo-luizz/terraform-example
    apply_requirements: [approved, mergeable]
    # Removido o "projects" que causou o erro
    allowed_overrides: [workflow, apply_requirements]
    allow_custom_workflows: true
    workflow: dev

workflows:
  dev:
    plan:
      steps:
        - env:
            name: GOOGLE_IMPERSONATE_SERVICE_ACCOUNT
            value: atlantis-sa@jeitto-dev.iam.gserviceaccount.com
        - init
        - plan
    apply:
      steps:
        - env:
            name: GOOGLE_IMPERSONATE_SERVICE_ACCOUNT
            value: atlantis-sa@jeitto-dev.iam.gserviceaccount.com
        - apply
